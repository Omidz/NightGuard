name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release: tag to create on this commit (e.g. v2.0.0). Leave empty for a plain build."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  windows:
    name: Build app, service and MSI (Windows)
    runs-on: windows-latest
    permissions:
      contents: write   # only used to attach the MSI to a release on v* tags
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = "2.0.${{ github.run_number }}"   # every CI build upgrades the previous one
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          if ('${{ inputs.release_tag }}' -match '^v\d+\.\d+\.\d+$') { $v = '${{ inputs.release_tag }}'.TrimStart('v') }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build and test
        run: |
          dotnet build NightGuard.sln -c Release
          dotnet test tests/NightGuard.Core.Tests -c Release --no-build

      - name: Publish (self-contained, no .NET install needed)
        shell: pwsh
        run: |
          $out = Join-Path $pwd 'out\publish'
          $common = @('-c', 'Release', '-r', 'win-x64', '--self-contained', 'true', '-p:DebugType=none', "-p:Version=${{ steps.version.outputs.version }}", '-o', $out)
          dotnet publish src/NightGuard.App @common
          dotnet publish src/NightGuard.Service @common
          Get-ChildItem $out -Filter 'NightGuard*.exe' | Format-Table Name, Length

      - name: Build MSI
        shell: pwsh
        run: |
          $pub = (Join-Path $pwd 'out\publish') + '\'
          dotnet build installer/NightGuard.Installer.wixproj -c Release -p:PublishDir=$pub -p:ProductVersion=${{ steps.version.outputs.version }} -o out\msi
          Get-ChildItem out\msi

      - uses: actions/upload-artifact@v4
        with:
          name: NightGuard-msi
          path: out/msi/*.msi
          if-no-files-found: error

      - name: Point the release tag at this commit
        if: inputs.release_tag != ''
        shell: pwsh
        run: |
          $tag = '${{ inputs.release_tag }}'
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "release_tag must look like v2.0.0" }
          git tag -f $tag ${{ github.sha }}
          git push -f origin "refs/tags/${tag}"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: NightGuard ${{ steps.version.outputs.version }}
          make_latest: true
          body: |
            🌙 **NightGuard ${{ steps.version.outputs.version }}**, your bedtime bouncer.

            Download **NightGuard.msi** below, double-click it, and follow the setup. Needs 64-bit Windows 10 or 11.
            Windows says "Windows protected your PC"? Click **More info** > **Run anyway** (the installer isn't code-signed).
            Smart App Control on? Setup shows you how to turn it off first, because it blocks apps that aren't code-signed.

            See the [README](https://github.com/Omidz/NightGuard#readme) for what it does and how the self-lock works.
          files: out/msi/NightGuard.msi
